[package]
name = "sculpt-app"
edition.workspace = true
version.workspace = true
publish.workspace = true
description = "MUD app shell: window, input, camera, rendering. Bevy 0.15 on wgpu."

[dependencies]
sculpt-core = { path = "../sculpt-core" }
glam = { workspace = true }
bevy = { version = "0.15", default-features = false, features = [
    "bevy_asset",
    "bevy_core_pipeline",
    "bevy_pbr",
    "bevy_render",
    "bevy_winit",
    "bevy_window",
    "bevy_picking",
    "tonemapping_luts",
    "ktx2",
    "zstd",
    "x11",
] }
# Immediate-mode UI for the top menu bar, tool palette, and status
# strip. 0.33 is the last version tracking Bevy 0.15. We deliberately
# opt out of `manage_clipboard` and `open_url` — no text fields to
# copy from, no links to launch — which strips the arboard and
# webbrowser transitive deps and keeps the binary lean.
bevy_egui = { version = "0.33", default-features = false, features = [
    "render",
    "default_fonts",
] }
